<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Only apply Chinese fonts when explicitly requesting Chinese language or CJK characters -->
    
    <!-- Chinese Simplified (zh-cn) -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-cn</string>
        </test>
        <test qual="any" name="family">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Serif CJK SC</string>
            <string>AR PL UMing CN</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-cn</string>
        </test>
        <test qual="any" name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK SC</string>
            <string>WenQuanYi Micro Hei</string>
            <string>AR PL UKai CN</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-cn</string>
        </test>
        <test qual="any" name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans Mono CJK SC</string>
            <string>WenQuanYi Micro Hei Mono</string>
        </edit>
    </match>

    <!-- Chinese Traditional (zh-tw) -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-tw</string>
        </test>
        <test qual="any" name="family">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Serif CJK TC</string>
            <string>AR PL UMing TW</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-tw</string>
        </test>
        <test qual="any" name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK TC</string>
            <string>WenQuanYi Micro Hei</string>
            <string>AR PL UKai TW</string>
        </edit>
    </match>

    <!-- Generic Chinese (zh) -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh</string>
        </test>
        <test qual="any" name="family">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Serif CJK SC</string>
            <string>AR PL UMing CN</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh</string>
        </test>
        <test qual="any" name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK SC</string>
            <string>WenQuanYi Micro Hei</string>
            <string>AR PL UKai CN</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh</string>
        </test>
        <test qual="any" name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans Mono CJK SC</string>
            <string>WenQuanYi Micro Hei Mono</string>
        </edit>
    </match>

    <!-- Fallback for CJK characters when no language is specified -->
    <!-- This provides Chinese fonts as fallback for CJK Unicode ranges -->
    <match target="pattern">
        <test name="family" compare="eq">
            <string>serif</string>
        </test>
        <edit name="family" mode="append" binding="weak">
            <string>Noto Serif CJK SC</string>
            <string>AR PL UMing CN</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="append" binding="weak">
            <string>Noto Sans CJK SC</string>
            <string>WenQuanYi Micro Hei</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>monospace</string>
        </test>
        <edit name="family" mode="append" binding="weak">
            <string>Noto Sans Mono CJK SC</string>
            <string>WenQuanYi Micro Hei Mono</string>
        </edit>
    </match>
</fontconfig>
